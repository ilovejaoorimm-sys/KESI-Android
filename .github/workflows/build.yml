name: Build and verify KESI APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['KESI-source.zip', 'app/**', 'backend/**', 'config/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test data collector
        run: python3 -m unittest discover -s backend -p 'test_*.py'
      - name: Test, lint and build signed installable debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KESI-Android-3.1.apk
          cd dist
          sha256sum KESI-Android-3.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KESI-Android-installable-APK
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KESI-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
